<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TU Sathi - Notes, syllabus and final board papers for students."
    >

    <meta
        name="theme-color"
        content="#1B4332"
    >

    <title data-page-title>
        TU Sathi
    </title>


    <!-- Prevent dark-mode flash -->
    <script>
        (function () {
            if (
                localStorage.getItem("studyhub-theme") === "dark"
            ) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>


    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/subject.css">
    <link rel="stylesheet" href="css/viewer.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body data-page="subject">


    <!-- Navbar -->
    <header data-header></header>


    <main class="container">


        <!-- Breadcrumb -->
        <nav
            class="breadcrumb"
            data-breadcrumb
            aria-label="Breadcrumb"
        >
            Loading...
        </nav>


        <!-- Subject Header -->
        <section class="course-banner panel">

            <div class="course-info">


                


                <!-- Subject Information -->
                <div>

                    <h1 data-subject-name>
                        Loading Subject...
                    </h1>


                    <p>

                        <b>

                            <span data-course-name>
                                Course
                            </span>

                            &nbsp;•&nbsp;

                            <span data-period-name>
                                Semester
                            </span>

                        </b>


                        <br>


                        <span data-subject-description>
                            Loading subject information...
                        </span>

                    </p>

                </div>

            </div>

        </section>


        <!-- Resource Tabs -->
        <div
            class="tabs"
            role="tablist"
            aria-label="Subject resources"
        >


            <button
                type="button"
                class="active"
                data-tab="notes"
                role="tab"
                aria-selected="true"
            >
                 &nbsp; Notes
            </button>


            <button
                type="button"
                data-tab="syllabus"
                role="tab"
                aria-selected="false"
            >
                 &nbsp; Syllabus
            </button>


            <button
                type="button"
                data-tab="papers"
                role="tab"
                aria-selected="false"
            >
                 &nbsp; Final Board Papers
            </button>


        </div>


        <!-- Resource / PDF Viewer -->
        <section class="viewer-grid">


            <!-- Resource List -->
            <aside class="note-list panel">

                <h3 data-list-title>
                    Notes
                </h3>


                <div data-resource-list>

                    <!-- Resources rendered by subject.js -->

                </div>


                <div class="view-only">

                    ⓘ &nbsp; This is a view only document.

                    <br>

                    &nbsp;&nbsp;&nbsp;&nbsp;
                    Downloading is not allowed.

                </div>

            </aside>


            <!-- PDF Viewer -->
            <section class="pdf-frame panel">

                <h3 data-viewer-title>
                    Select a document
                </h3>


                <iframe
                    data-pdf-viewer
                    title="PDF Viewer"
                    loading="lazy"
                ></iframe>


                <!-- PDF Pagination -->
                <div class="pager">


                    <button
                        type="button"
                        data-first-page
                        aria-label="First page"
                    >
                        «
                    </button>


                    <button
                        type="button"
                        data-prev-page
                        aria-label="Previous page"
                    >
                        ‹
                    </button>


                    <span data-current-page>
                        1
                    </span>


                    <span aria-hidden="true">
                        /
                    </span>


                    <span data-total-pages>
                        1
                    </span>


                    <button
                        type="button"
                        data-next-page
                        aria-label="Next page"
                    >
                        ›
                    </button>


                    <button
                        type="button"
                        data-last-page
                        aria-label="Last page"
                    >
                        »
                    </button>


                </div>

            </section>


        </section>


    </main>


    <!-- Footer -->
    <footer data-footer></footer>


    <!-- JavaScript -->
    <script
        type="module"
        src="js/app.js"
    ></script>

    <script
        type="module"
        src="js/subject.js"
    ></script>


</body>
</html>
