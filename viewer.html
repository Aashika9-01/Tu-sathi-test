<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View educational notes, syllabus, question papers and study resources on TU Sathi."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        Document Viewer | TU Sathi
    </title>


    <!-- ========================= -->
    <!-- Theme -->
    <!-- ========================= -->

    <script>
        (() => {

            const theme =
                localStorage.getItem("studyhub-theme");

            if (theme === "dark") {

                document.documentElement.classList.add("dark");

            }

        })();
    </script>


    <!-- ========================= -->
    <!-- CSS -->
    <!-- ========================= -->

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/viewer.css">
    <link rel="stylesheet" href="css/footer.css">

    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <!-- ========================= -->
    <!-- Navbar -->
    <!-- ========================= -->

    <header data-header></header>


    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main class="container section">


        <!-- Breadcrumb -->

        <nav
            class="breadcrumb"
            data-breadcrumb
            aria-label="Breadcrumb"
        >
            Document Viewer
        </nav>


        <!-- ========================= -->
        <!-- Viewer -->
        <!-- ========================= -->

        <section class="viewer-grid">


            <!-- ========================= -->
            <!-- Resource Sidebar -->
            <!-- ========================= -->

            <aside class="note-list panel">


                <h3 data-subject-title>
                    Subject Resources
                </h3>


                <div data-resource-list>

                    <!-- Resources will be loaded dynamically -->

                </div>


                <div class="view-only">

                    <span aria-hidden="true">ⓘ</span>

                    View only document.

                    <br>

                    Downloading is not allowed.

                </div>


            </aside>


            <!-- ========================= -->
            <!-- PDF -->
            <!-- ========================= -->

            <section class="pdf-frame panel">


                <h3 data-document-title>
                    Loading document...
                </h3>


                <iframe
                    id="pdfViewer"
                    data-pdf-viewer
                    title="TU Sathi Document Viewer"
                ></iframe>


                <!-- ========================= -->
                <!-- Pager -->
                <!-- ========================= -->

                <div class="pager">

                    <button
                        type="button"
                        data-first-page
                        aria-label="First page"
                    >
                        «
                    </button>


                    <button
                        type="button"
                        data-prev-page
                        aria-label="Previous page"
                    >
                        ‹
                    </button>


                    <span data-current-page>
                        1
                    </span>


                    <span aria-hidden="true">
                        /
                    </span>


                    <span data-total-pages>
                        1
                    </span>


                    <button
                        type="button"
                        data-next-page
                        aria-label="Next page"
                    >
                        ›
                    </button>


                    <button
                        type="button"
                        data-last-page
                        aria-label="Last page"
                    >
                        »
                    </button>

                </div>


            </section>


        </section>


    </main>


    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer data-footer></footer>


    <!-- ========================= -->
    <!-- Main Application -->
    <!-- ========================= -->

    <script
        type="module"
        src="js/app.js"
    ></script>


    <!-- ========================= -->
    <!-- Viewer -->
    <!-- ========================= -->

    <script
        type="module"
        src="js/viewer.js"
    ></script>


    <!-- ========================= -->
    <!-- Viewer URL Loader -->
    <!-- ========================= -->

    <script>

        window.addEventListener("load", () => {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const file =
                params.get("file");


            const title =
                params.get("title");


            const viewer =
                document.getElementById("pdfViewer");


            const documentTitle =
                document.querySelector(
                    "[data-document-title]"
                );


            console.log(
                "TU Sathi Viewer"
            );


            console.log(
                "File:",
                file
            );


            if (!viewer) {

                console.error(
                    "PDF iframe not found."
                );

                return;

            }


            if (!file) {

                console.error(
                    "No PDF file supplied."
                );

                if (documentTitle) {

                    documentTitle.textContent =
                        "No document selected";

                }

                return;

            }


            /*
             * Decode URL parameter.
             */

            const pdfPath =
                decodeURIComponent(file);


            /*
             * Force the PDF into the iframe without toolbar / download option.
             */

            const cleanPath = String(pdfPath).split("#")[0];
            viewer.src = cleanPath + "#toolbar=0&navpanes=0&scrollbar=0";


            /*
             * Update document title.
             */

            if (documentTitle) {

                if (title) {

                    documentTitle.textContent =
                        decodeURIComponent(title);

                } else {

                    const filename =
                        pdfPath
                            .split("/")
                            .pop()
                            .replace(
                                /\.pdf$/i,
                                ""
                            )
                            .replace(
                                /[-_]+/g,
                                " "
                            );


                    documentTitle.textContent =
                        filename;

                }

            }


            /*
             * Update browser title.
             */

            if (title) {

                document.title =
                    decodeURIComponent(title)
                    + " | TU Sathi";

            }


            console.log(
                "PDF loaded:",
                pdfPath
            );

        });

    </script>


</body>

</html>
