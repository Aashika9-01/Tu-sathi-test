<!DOCTYPE html>
<html lang="en">

<head>
<script>
(function(){

    const theme = localStorage.getItem("studyhub-theme");

    if(theme === "dark"){

        document.documentElement.classList.add("dark");

    }

})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-page-title>TU Sathi</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/semester.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body data-page="semester">

    <header data-header></header>

    <main class="container">

        <nav class="breadcrumb" data-breadcrumb>
            Loading...
        </nav>

        <section class="course-banner panel">

            <div class="course-info">

                <span class="icon" data-course-icon>
                    📚
                </span>

                <div>

                    <h1 data-course-name>
                        Loading Course...
                    </h1>

                    <p data-course-fullname></p>

                    <p data-course-description>
                        Loading semester information...
                    </p>

                </div>

            </div>

            <div class="stats">

                <div class="mini-stat">

                    <b data-current-period>
                        0
                    </b>

                    <small data-period-label>
                        Semester
                    </small>

                </div>

                <div class="mini-stat">

                    <b data-subject-count>
                        0
                    </b>

                    <small>
                        Subjects
                    </small>

                </div>

                <div class="mini-stat">

                    <b data-note-count>
                        0
                    </b>

                    <small>
                        Notes
                    </small>

                </div>

                <div class="mini-stat">

                    <b data-paper-count>
                        0
                    </b>

                    <small>
                        Papers
                    </small>

                </div>

            </div>

        </section>

        <section class="panel">

            <div class="subject-heading">

                <h2 class="section-title" data-semester-title>
                    Subjects
                </h2>

                <p>
                    Select a subject to view notes, syllabus and final board question papers.
                </p>

            </div>

            <div class="subject-grid" data-subjects>

                <!-- Subjects will be rendered by JavaScript -->

            </div>

            <div class="empty-state" data-empty-state hidden>

                <h3>
                    No subjects available
                </h3>

                <p>
                    Content will be added soon.
                </p>

            </div>

        </section>

    </main>

    <footer data-footer></footer>

    <script type="module" src="js/app.js"></script>
  <script src="js/semester.js"></script>

</body>

</html>
